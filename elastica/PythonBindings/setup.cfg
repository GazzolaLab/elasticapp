[metadata]
name = elasticapp
version = @elastica_VERSION@
description = Python bindings for Elastica++
author = Elastica development team
url = cosseratrods.org
license = MIT

[options]
packages = find:
install_requires =
    numpy
    scipy
    matplotlib
    rich
    pandas
    # h5py >= 3.0.0

[options.package_data]
# Install Python bindings libs alongside the Python code
* = *.so

[options.entry_points]
console_scripts =
    elastica = elasticapp.__main__:main