[metadata]
name = elasticapp
version = @elastica_VERSION@
description = Python bindings for Elastica++
author = Elastica development team
url = cosseratrods.org
license = MIT

[options]
packages = find:
install_requires = @ELASTICA_PY_DEPS_OUTPUT@
python_requires = >=3.7

[options.extras_require]
dev = @ELASTICA_PY_DEV_DEPS_OUTPUT@

[options.package_data]
# Install Python bindings libs alongside the Python code
* = *.so

[options.entry_points]
console_scripts =
    elastica = elasticapp.__main__:main
