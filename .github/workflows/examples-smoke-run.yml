name: Example Smoke Run

on:
  pull_request:
    branches: ["main"]

jobs:
  examples:
    name: Ubuntu Examples Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3-pip zip unzip curl pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python -m pip install pybind11

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      - name: Configure
        shell: bash
        run: |
          cmake \
            -B build \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_C_COMPILER="$(which gcc)" \
            -D CMAKE_CXX_COMPILER="$(which g++)" \
            -D CMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -D BUILD_TESTING=OFF \
            -D ELASTICA_BUILD_BENCHMARKS=OFF \
            -D ELASTICA_BUILD_DOCUMENTATION=OFF \
            -D ELASTICA_BUILD_EXAMPLES=ON \
            -D ELASTICA_BUILD_PYTHON_BINDINGS=OFF

      - name: Build example executables
        run: |
          cmake --build build --target \
            example_axial_stretching \
            example_butterfly \
            example_free_nest \
            example_oscillatory_magnetic_field \
            example_timoshenko \
            --parallel

      - name: Run Axial Stretching
        shell: bash
        working-directory: build
        run: |
          ./bin/example_axial_stretching --n_steps 10

      - name: Run Butterfly
        shell: bash
        working-directory: build
        run: |
          ./bin/example_butterfly --n_steps 10

      - name: Run Free Nest
        shell: bash
        working-directory: build
        run: |
          mkdir -p data
          ./bin/example_free_nest --final_sim_time 0.05

      - name: Run Oscillatory Magnetic Field
        shell: bash
        working-directory: build
        run: |
          ./bin/example_oscillatory_magnetic_field --final_sim_time 0.01

      - name: Run Timoshenko
        shell: bash
        working-directory: build
        run: |
          ./bin/example_timoshenko --n_steps 10
