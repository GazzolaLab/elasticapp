name: CMake Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release #, Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    #name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }} # будет запускаться по очереди на всех типах машин
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # macos-latest
        generators: [Ninja]
        build_type: [Release, Debug]
        include:
          - cc: gcc-10
            cxx: g++-10
          - cc: gcc-11
            cxx: g++-11
          - cc: gcc-12
            cxx: g++-12
          - cc: clang-10
            cxx: clang++-10

    steps:
    - uses: actions/checkout@v3

    - name: Configuration Setting
      run:
        echo ${{ matrix.config.os }}
        echo ${{ matrix.config.cc }}
        echo ${{ matrix.config.cxx }}
        echo ${{ matrix.config.generators }}
        echo ${{ matrix.config.build_type}}

