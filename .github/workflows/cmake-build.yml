name: CMake Build

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:  # Only run on deefault-compiler
        include:
          - name: Ubuntu GCC Debug
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Debug
            run_tests: true
            asan: false
            ubsan: false
          - name: Ubuntu Clang Release
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
            run_tests: true
            asan: false
            ubsan: false
          - name: Ubuntu Clang Debug Sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            run_tests: true
            asan: true
            ubsan: true
          - name: macOS AppleClang Release Build
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
            run_tests: true
            asan: false
            ubsan: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build python3-pip

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja python

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python -m pip install pybind11

      - name: Install third-party dependencies
        shell: bash
        run: |
          git clone --depth 1 https://github.com/tp5uiuc/elastica_quick_setup
          cd elastica_quick_setup
          bash install.sh

      - name: Print tool versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          python --version
          "${{ matrix.cc }}" --version
          "${{ matrix.cxx }}" --version

      - name: Configure
        shell: bash
        run: |
          THIRD_PARTY_ROOT="${HOME}/Desktop/third_party_installed"
          export BLAZE_ROOT="${THIRD_PARTY_ROOT}"
          export BLAZE_TENSOR_ROOT="${THIRD_PARTY_ROOT}"
          export BRIGAND_ROOT="${THIRD_PARTY_ROOT}"
          export cxxopts_DIR="${THIRD_PARTY_ROOT}"
          export YamlCpp_ROOT="${THIRD_PARTY_ROOT}"
          cmake \
            -B build \
            -G Ninja \
            -D CMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -D CMAKE_C_COMPILER="$(which "${{ matrix.cc }}")" \
            -D CMAKE_CXX_COMPILER="$(which "${{ matrix.cxx }}")" \
            -D BUILD_TESTING=${{ matrix.run_tests }} \
            -D ASAN=${{ matrix.asan }} \
            -D UBSAN_UNDEFINED=${{ matrix.ubsan }} \
            -D ELASTICA_BUILD_BENCHMARKS=OFF \
            -D ELASTICA_BUILD_DOCUMENTATION=OFF \
            -D ELASTICA_BUILD_EXAMPLES=OFF \
            -D ELASTICA_BUILD_PYTHON_BINDINGS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        if: matrix.run_tests
        working-directory: build
        env:
          CTEST_OUTPUT_ON_FAILURE: "1"
        run: ctest --output-on-failure --build-config "${{ matrix.build_type }}"
