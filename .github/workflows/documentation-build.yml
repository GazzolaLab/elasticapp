name: Documentation Build

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/documentation-build.yml"
      - "CMakeLists.txt"
      - "docs/**"
      - "elastica/**"
      - "README.md"

jobs:
  docs:
    name: Doxygen Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build doxygen graphviz

      - name: Print tool versions
        run: |
          cmake --version
          ninja --version
          doxygen --version

      - name: Configure documentation build
        run: |
          cmake \
            -B build \
            -G Ninja \
            -D ELASTICA_BUILD_DOCUMENTATION=ON

      - name: Build documentation
        run: cmake --build build --target doc --parallel
