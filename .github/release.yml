# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes#configuring-automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 'Breaking Changes and Deprecations :boom:'
      labels:
        - breaking
        - deprecated
    - title: 'New Features :tada:'
      labels:
        - type:enhancement
    - title: 'Build System :package:'
      labels:
        - type:buildsystem
    - title: 'Bug fixes :beetle:'
      labels:
        - type:bug
        - type:bug-compile
        - type:bug-runtime
        - type:bug-invalid
    - title: 'Performance :racehorse:'
      labels:
        - type:optimization
    - title: 'Documentation :books:'
      labels:
        - type:documentation
    - title: 'Refactor :hammer:'
      labels:
        - refactor
    - title: Other Changes
      labels:
        - "*"
