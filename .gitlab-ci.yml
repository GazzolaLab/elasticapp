stages:
  - build
  # - lint
  # - test

.job_template: &build_job_docker_modules
  stage: build
  tags:
    - docker
    - modules
  image: ospray/docker-images:centos6-mod # default image
  script:
    - scripts/linux_build.sh # default script

### BUILD JOBS ###
build-centos6-gcc:
  <<: *build_job_docker_modules
  script:
    - module load cmake
    - module load gcc/4.8.2
    - module load tbb
    # - module load ispc
    - export CC=gcc
    - export CXX=g++
    - scripts/linux_build.sh
  artifacts:
    paths:
      - $CI_PROJECT_DIR
    expire_in : 2 hours
